# code-review 探针注册表：维护执行顺序、依赖和参数。
# required / requires 及执行状态的含义见 references/output-schema.md 第 4 节。

version: 1

execution:
  mode: sequential
  max_retry: 1              # reconciliation 发现遗漏时重派的次数上限

# scripts/review-mode 判断是否派发：always 总派，never 不派，auto 按 skip_when 决定。
# no_findings 指无 critical/high；only_docs 指改动全为 .md / .rst / .txt。
# strict 在跳过且仍有 open critical/high 时阻塞；advisory 只告警。

reviewer:
  mode: auto
  skip_when:
    - no_findings
    - only_docs
  policy: strict

# requires 列出输入依赖；rules 默认使用内置规则，覆盖率由 test-coverage 内部可选处理。

probes:
  - name: behavior-review
    title: 行为正确性
    file: references/probes/behavior-review.md
    required: true
    requires: []

  - name: test-coverage
    title: 测试质量与增量覆盖率
    file: references/probes/test-coverage.md
    required: true
    requires: []
    params:
      line_target: 85
      branch_target: 80

  - name: repo-guard
    title: 仓库规范
    file: references/probes/repo-guard.md
    required: true
    requires: [rules]
    params:
      read_only: true
      # 规则包选择优先级见 probes/repo-guard.md。
      rules_dir: references/rules

  - name: impact-analysis
    title: 影响分析
    file: references/probes/impact-analysis.md
    required: false
    requires: []
    params:
      depth: 1              # 调用方追踪深度（fan-in 的层数）
