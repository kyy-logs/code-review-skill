name: Update NEWS unreleased block

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - NEWS.md
      - README.md
      - README.zh-CN.md
      - docs/**
      - eval/**

permissions:
  contents: read

concurrency:
  group: news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test NEWS update
        run: python -m unittest discover -s tests -p 'test_news_update.py' -v
      - name: Update Unreleased block
        run: |
          python scripts/news-update.py
          python scripts/news-update.py --check
      - name: Commit NEWS if changed
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- NEWS.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- NEWS.md
          git commit -m 'docs: update NEWS unreleased block'
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
